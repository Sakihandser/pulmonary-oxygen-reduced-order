   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(92.769609 34.217381)">37 published quantitative records from 8 studies</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(63.866953 45.019842)">Primary response set: 11 changes and 6 baseline calibrations</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(83.946094 55.822303)">No new patient data in the matched-scaling analysis</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(50.057375 101.841102)">Primary nonhyperoxic strata</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(27.441125 111.44329)">Early Zurich: 4 changes, thermodilution</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(32.816125 121.045477)">Recent Zurich: 3 changes, direct Fick</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(41.26175 130.647665)">Historical: 4 changes in 2 people</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(44.14425 140.249852)">3 source families; measured Pv</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(248.381008 100.770731)">Separate evidence strata</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(250.267609 110.973056)">1 pure-oxygen condition</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(224.314055 121.17538)">3 exercise checks using Sv inversion</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(259.001359 131.377704)">6 COPD/IPF changes</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(255.109953 141.580028)">7 cross-sectional rows</text>
   </g>
