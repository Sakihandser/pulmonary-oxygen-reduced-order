   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(92.769609 34.217381)">37 published quantitative records from 8 studies</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(70.422891 45.019842)">7 earlier individual rows + 7 states in 2 additional patients</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(148.854375 55.822303)">+ 23 aggregate records</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(43.55968 104.097814)">Primary response comparison</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(52.17257 114.300138)">11 nonhyperoxic changes</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(40.696906 124.502462)">3 cohort families; measured Pv</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(38.773781 134.704786)">6 separate baseline calibrations</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(248.381008 98.996651)">Separate evidence strata</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(250.267609 109.198976)">1 pure-oxygen condition</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(224.314055 119.4013)">3 exercise checks using Sv inversion</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(259.001359 129.603624)">6 COPD/IPF changes</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(255.109953 139.805948)">7 cross-sectional rows</text>
   </g>
